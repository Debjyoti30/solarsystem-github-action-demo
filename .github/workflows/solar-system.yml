name: Defining CI pipeline /workflow for the solar system project
on: 
 push:
   branches:
     - main
     - 'feature/*'
   
 pull_request:
    branches: [main]

 workflow_dispatch:
   
jobs:
  unit-test:
    name: unit test
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: insall NPM and test it 
        run: |
             npm install
             npm test
